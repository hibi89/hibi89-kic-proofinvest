name: offline-tests
on:
  push:
    branches: [main, 'lead/**', 'feature/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline Streamlit UI test dependencies (no API keys)
        run: python -m pip install -r requirements-ui.txt
      - name: Guard SEC Decimal integration and judge receipt (offline, no credentials)
        run: |
          mkdir -p /tmp/kic-guard-evidence
          python -B -m unittest discover -s tests -p 'test_guard*.py' -v
          python -B -m proofinvest.guard_demo > /tmp/kic-guard-evidence/guard-demo.json
          python -c 'import json; r=json.load(open("/tmp/kic-guard-evidence/guard-demo.json")); assert r["audited_run_count"] == 4; assert [x["decision"] for x in r["runs"]] == ["HOLD", "REJECT", "APPROVE"]; assert r["curated_sec"]["conflicting_claim_status"] == "conflict"; assert r["curated_sec"]["guard_decision"] == "HOLD"; assert r["audit_valid"] and r["reviews_valid"]; assert not r["live_api_called"] and not r["trade_executed"]'
      - name: Archive offline Guard judge receipt (no private submission materials)
        uses: actions/upload-artifact@v4
        with:
          name: proofinvest-guard-offline-receipt
          path: /tmp/kic-guard-evidence/guard-demo.json
          if-no-files-found: error
          retention-days: 14
      - name: Execute 15-case question-router judge matrix (offline)
        run: |
          mkdir -p /tmp/kic-router-judge
          python -B -m scripts.kic_router_judge_matrix /tmp/kic-router-judge/router-matrix.json
          python -c 'import json; x=json.load(open("/tmp/kic-router-judge/router-matrix.json")); assert x["status"] == "PASS" and x["passed"] == x["cases"] == 15 and x["failed"] == 0; assert x["llm_requests"] == x["real_sec_requests"] == x["trades"] == 0; assert not x["source_authenticated"]'
      - name: Archive reproducible router judge matrix (no personal data)
        uses: actions/upload-artifact@v4
        with:
          name: proofinvest-router-judge-matrix
          path: /tmp/kic-router-judge/router-matrix.json
          if-no-files-found: error
          retention-days: 14
      - name: Verify 60-day progress and handoff synchronization
        run: python scripts/master_progress.py --check
      - name: Full 60-day master progress JSON sync check
        run: python render_master_progress.py --check
      - name: P179 real local model-compatible HTTP protocol and fail-closed triage (emulated model)
        run: python -B -m unittest tests.test_ticker_local_model_triage -v
      - name: P178 actual file-backed SEC + stock + NDX local review CLI (offline)
        run: python -B -m scripts.local_originals_review_smoke
      - name: P177 native loopback local HTTP smoke (no SEC/vendor API)
        run: python -B -m scripts.local_ui_launcher --smoke --port 18681
      - name: One-command full local verifier (syntax, SHA, unittest, AppTest; no API)
        run: python -B -m scripts.verify_local --full
      - name: Guard decision, audit, review and workflow regressions (offline)
        run: |
          python -B -m unittest discover -s tests -p 'test_guard*.py' -v

      - name: Synthetic snapshot create/reuse/reload (temporary HOME; no credentials)
        run: |
          export HOME="$(mktemp -d)"
          python -m proofinvest.snapshot_store --save > /tmp/proofinvest-snapshot-created.json
          python -m proofinvest.snapshot_store --save > /tmp/proofinvest-snapshot-reused.json
          python -m proofinvest.snapshot_store --read > /tmp/proofinvest-snapshot-read.json
          python -c 'import json; a,b,c=[json.load(open(p)) for p in ("/tmp/proofinvest-snapshot-created.json","/tmp/proofinvest-snapshot-reused.json","/tmp/proofinvest-snapshot-read.json")]; assert (a["status"],b["status"],c["status"])==("CREATED","REUSED_NO_RECALCULATION","READ_NO_RECALCULATION"); assert a["risk_display_pct"]==b["risk_display_pct"]==c["risk_display_pct"]=="266.67"; assert all(x["authenticated_external_source"] is False for x in (a,b,c))'

      - name: Assemble, verify and restore public synthetic-only demo
        run: |
          mkdir -p /tmp/kic-synthetic-demo
          python scripts/synthetic_demo_bundle.py build /tmp/kic-synthetic-demo/proofinvest-offline-demo.zip
          python scripts/synthetic_demo_bundle.py verify /tmp/kic-synthetic-demo/proofinvest-offline-demo.zip
          python scripts/synthetic_demo_bundle.py extract /tmp/kic-synthetic-demo/proofinvest-offline-demo.zip /tmp/kic-synthetic-demo/restore
          (
            cd /tmp/kic-synthetic-demo/restore
            python -m proofinvest --claim-revenue-growth-pct 20 > /tmp/kic-synthetic-demo/restored-cli.json
            export HOME="$(mktemp -d)"
            python -m proofinvest.snapshot_store --save > /tmp/kic-synthetic-demo/restored-save.json
            python -m proofinvest.snapshot_store --read > /tmp/kic-synthetic-demo/restored-read.json
          )
          python -c 'import json; a=json.load(open("/tmp/kic-synthetic-demo/restored-cli.json")); b=json.load(open("/tmp/kic-synthetic-demo/restored-read.json")); assert a["source_kind"]=="SYNTHETIC_FIXTURE" and a["status"]=="demo_not_real"; assert b["source_kind"]=="SYNTHETIC_FIXTURE" and b["risk_display_pct"]=="266.67" and b["authenticated_external_source"] is False'
      - name: Archive PUBLIC SYNTHETIC demo only (no private PDF/PPTX)
        uses: actions/upload-artifact@v4
        with:
          name: proofinvest-synthetic-demo-recovery
          path: /tmp/kic-synthetic-demo/proofinvest-offline-demo.zip
          if-no-files-found: error
          retention-days: 14

      - name: Generate bounded PUBLIC judge replay receipt (manual offline only)
        run: |
          mkdir -p /tmp/kic-public-judge-replay
          python -m scripts.public_judge_artifact /tmp/kic-public-judge-replay/judge-replay.json
          python -m scripts.public_judge_artifact --verify /tmp/kic-public-judge-replay/judge-replay.json
      - name: Archive PUBLIC manual judge replay receipt (NO private submission materials)
        uses: actions/upload-artifact@v4
        with:
          name: proofinvest-public-judge-replay
          path: /tmp/kic-public-judge-replay/judge-replay.json
          if-no-files-found: error
          retention-days: 14

      - name: Build and strictly verify THREE synthetic SEC-to-Guard judge cases
        run: |
          mkdir -p /tmp/kic-sec-guard-judge
          python -B -m scripts.sec_guard_judge_pack build /tmp/kic-sec-guard-judge/proofinvest-SYNTHETIC-judge.zip
          python -B -m scripts.sec_guard_judge_pack verify /tmp/kic-sec-guard-judge/proofinvest-SYNTHETIC-judge.zip
      - name: Archive PUBLIC SYNTHETIC SEC-to-Guard judge bundle (NO private inputs)
        uses: actions/upload-artifact@v4
        with:
          name: proofinvest-sec-guard-synthetic-judge-pack
          path: /tmp/kic-sec-guard-judge/proofinvest-SYNTHETIC-judge.zip
          if-no-files-found: error
          retention-days: 14

      - name: Bounded rule-based workflow controller (NO AI/remote API)
        run: |
          python -m proofinvest.agent_controller --claim 16.20 > /tmp/kic-offline-controller-matched.json
          python -m proofinvest.agent_controller --claim 30 > /tmp/kic-offline-controller-conflict.json
          python -c 'import json; a=json.load(open("/tmp/kic-offline-controller-matched.json")); b=json.load(open("/tmp/kic-offline-controller-conflict.json")); assert a["reason_code"]=="RISK_FACTS_NOT_ELIGIBLE" and b["reason_code"]=="GROWTH_CLAIM_CONFLICT"; assert all(x["external_tool_calls"]==0 and x["ai_agent_executed"] is False and x["live_api_called"] is False and len(x["tool_calls"])<=1 for x in (a,b))'
      - name: Synthetic demo (no credentials)
        run: python -m proofinvest --claim-revenue-growth-pct 20 > /tmp/proofinvest-demo.json
      - name: Recorded real filing scenario demo (offline, no network)
        run: python -m proofinvest.evidence_scenarios > /tmp/proofinvest-real-evidence-scenarios.json

  windows-audit-inspector:
    name: Windows SQLite lock and offline inspector regressions
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Guard inspector Windows file-lock regression (stdlib only)
        run: |
          python -B -m unittest discover -s tests -p "test_guard_audit_inspector.py" -v
          python -B -m unittest discover -s tests -p "test_guard_history_reader.py" -v
      - name: Offline Disclosure Lightning index and original-file Windows lock regressions
        run: |
          python -B -m unittest discover -s tests -p "test_disclosure_lightning.py" -v
          python -B -m unittest discover -s tests -p "test_disclosure_lightning_originals.py" -v

      - name: Assert reviewed evidence is excluded from Windows newline conversion
        shell: pwsh
        run: |
          $evidence = "docs/evidence/samsung_2024_cfs_revenue.json"
          $attr = git check-attr text -- $evidence
          if ($attr -notmatch ': text: unset$') { throw "Reviewed evidence must be -text: $attr" }
          git -c core.autocrlf=true restore --source=HEAD --worktree -- $evidence
      - name: Verify exact issuer Git blob and offline controller on Windows
        run: |
          python -B -m unittest discover -s tests -p "test_manual_case_demo.py" -v
          python -B -m unittest discover -s tests -p "test_agent_controller.py" -v
      - name: More Windows SQLite lifecycle regression suites
        run: |
          python -B -m unittest discover -s tests -p "test_dl_metadata_versions.py" -v
          python -B -m unittest discover -s tests -p "test_dl_original_span_bridge.py" -v
          python -B -m unittest discover -s tests -p "test_guard_audit.py" -v
          python -B -m unittest discover -s tests -p "test_guard_registry_link.py" -v
          python -B -m unittest discover -s tests -p "test_guard_review.py" -v
          python -B -m unittest discover -s tests -p "test_guard_workflow.py" -v
          python -B -m unittest discover -s tests -p "test_local_sec_guard_report.py" -v

  browser:
    name: Chromium Guard click-through (offline evidence)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install local UI and Chromium testing dependencies
        run: |
          python -m pip install -r requirements-ui.txt playwright
          python -m playwright install --with-deps chromium
      - name: P213 real NVIDIA Guard consent -> Chromium ZIP download -> offline replay
        run: |
          python -B -m scripts.nvidia_audit_download_browser_smoke /tmp/kic-p213-nvda-browser
          python -c 'import json; x=json.load(open("/tmp/kic-p213-nvda-browser/p213-nvda-download-browser.json")); assert x["status"]=="PASS" and x["chromium_download_verified"] and x["new_session_consent_required"] and x["guard_decision"]=="HOLD" and x["replay"]=="LOCAL_NVDA_BUNDLE_DIGEST_AND_REPLAY_PASS" and len(x["issuer_original_sha256"])==64 and len(x["download_sha256"])==64 and x["external_http_allowed"] is False and x["sec_original_authenticated"] is False and x["source_rights_verified"] is False and x["trade_executed"] is False and x["public_production_verified"] is False'
      - name: P221 actual Chromium issuer Engine B + local NDX Engine A download
        run: |
          python -B -m scripts.real_issuer_ab_browser_smoke /tmp/kic-p221-issuer-ab-browser
          python -c 'import json; x=json.load(open("/tmp/kic-p221-issuer-ab-browser/p221-browser-receipt.json")); assert x["status"]=="PASS" and x["actual_streamlit_download"] and x["joined_ab_checksum_valid"] and x["guard_preview"]=="HOLD" and x["stock_ndx_issuer_bound"] and x["external_http_allowed"] is False and x["market_rights_verified"] is False and x["sec_raw_bytes_verified"] is False and x["trade_executed"] is False'
      - name: Archive P221 source-derived local A/B browser evidence (synthetic market only)
        uses: actions/upload-artifact@v4
        with:
          name: kuodra-p221-issuer-ab-browser
          path: |
            /tmp/kic-p221-issuer-ab-browser/p221-ab-review.png
            /tmp/kic-p221-issuer-ab-browser/p221-browser-receipt.json
          if-no-files-found: error
          retention-days: 14
      - name: Archive P213 NVIDIA real-source-derived local Chromium receipt (not publisher raw)
        uses: actions/upload-artifact@v4
        with:
          name: kuodra-p213-local-nvda-download-chromium
          path: |
            /tmp/kic-p213-nvda-browser/p213-real-nvda-audit.png
            /tmp/kic-p213-nvda-browser/p213-nvda-download-browser.json
          if-no-files-found: error
          retention-days: 14
      - name: Click through actual browser UI and verify SQLite
        run: |
          python -B -m scripts.guard_browser_smoke /tmp/kic-guard-browser
      - name: Actual Chromium manual SEC WEB -> Guard click matrix (no external HTTP)
        run: |
          python -B -m scripts.sec_web_guard_browser_smoke /tmp/kic-manual-web-guard-browser
          python -c 'import json; x=json.load(open("/tmp/kic-manual-web-guard-browser/web-guard-browser-evidence.json")); assert x["status"]=="PASS" and [r["guard_decision"] for r in x["browser_scenarios"]]==["REJECT","HOLD","HOLD","REJECT",None,"HOLD"] and x["custom_textbox_chromium_tested"] is True and x["download_receipt_verified"] is True and x["invalid_custom_claim_fail_closed"] is True and not x["browser_external_requests"] and x["sqlite_audit_created"] is False and x["external_sec_original_authenticated"] is False and x["contest_submitted"] is False'
      - name: Archive ACTUAL Chromium manual SEC WEB -> Guard screenshots and receipt (NO private PDF)
        uses: actions/upload-artifact@v4
        with:
          name: kuodra-manual-sec-web-guard-chromium-e2e
          path: |
            /tmp/kic-manual-web-guard-browser/web-guard-before-click.png
            /tmp/kic-manual-web-guard-browser/web-guard-conflict.png
            /tmp/kic-manual-web-guard-browser/web-guard-matched.png
            /tmp/kic-manual-web-guard-browser/web-guard-missing.png
            /tmp/kic-manual-web-guard-browser/web-guard-custom-conflict.png
            /tmp/kic-manual-web-guard-browser/web-guard-custom-invalid.png
            /tmp/kic-manual-web-guard-browser/web-guard-custom-matched.png
            /tmp/kic-manual-web-guard-browser/web-guard-browser-evidence.json
          if-no-files-found: error
          retention-days: 14
      - name: Chromium CSV source + 3 engines → SEC Guard → JSON and HTML
        run: |
          python -B -m scripts.local_workspace_browser_smoke /tmp/kic-local-upload-browser
          python -c 'import json; x=json.load(open("/tmp/kic-local-upload-browser/kuodra-local-upload-browser.json")); assert x["status"]=="PASS" and x["market_sec_context_bound"] is False and x["market_sec_future_filing_withheld"] is True and x["market_guard_policy_modified"] is False and x["market_in_guard_audit"] is False and x["market_csv_regression_visible"] is True and len(x["market_csv_original_sha256"])==64 and x["industry_sec_source_bound"] is True and x["all_three_engines_reported"] is True and x["combined_risk_score_available"] is False and x["industry_growth_gap_pp"]=="80.00" and x["network_sec_requests"]==0 and len(x["market_upload_sha256"])==64 and len(x["industry_upload_sha256"])==64 and x["p117_four_source_chromium_report_verified"] is True and x["p122_local_workflow_trace_visible"] is True and x["p123_human_acknowledgement_browser_verified"] is True and x["p124_local_engine_b_cash_replay_visible"] is True and x["p125_offline_vendor_licensing_review_visible"] is True and x["p126_historical_apple_ticker_real_chromium"] is True and len(x["p117_original_sha256"])==64'
      - name: P165/P166 actual Chromium packet and original SEC + NDX replay
        run: |
          python -B -m scripts.review_packet_browser_smoke /tmp/kic-p165-review-packet-browser
          python -c 'import json; x=json.load(open("/tmp/kic-p165-review-packet-browser/p165-review-packet-browser.json")); assert x["status"]=="PASS" and x["synthetic_only"] is True and x["real_chromium"] is True and x["valid_reupload_internal_integrity_passed"] is True and x["passive_upload_no_approval"] is True and x["changed_bytes_rejected"] is True and x["oversized_bytes_rejected"] is True and x["live_sec_button_disabled"] is True and x["browser_external_requests"]==0 and x["sqlite_guard_audit_written"] is False and x["publisher_source_authenticated"] is False and x["vendor_rights_verified"] is False and x["synthetic_original_sec_and_price_replayed_in_browser"] is True and x["tampered_original_blocked_in_browser"] is True and x["initial_offline_review_packet_generated_and_downloaded"] is True and x["initial_review_wrong_index_rejected"] is True and x["source_clearance_gap_json_real_browser_downloaded"] is True and x["local_csv_original_to_normalized_json_review_downloaded"] is True and x["csv_lineage_packet_hash_verified"] is True and x["qqq_csv_as_ndx_blocked"] is True and x["printable_report_html_downloaded_and_rendered_in_chromium"] is True and x["html_exact_review_rights_and_csv_lineage_bound"] is True and x["html_external_content_and_source_rows_absent"] is True and x["single_zip_downloaded_actual_chromium"] is True and x["bundle_contains_exact_review_rights_html_lineage"] is True and x["bundle_no_rights_or_trade_grants"] is True and x["rights_report_bound_to_exact_review_packet"] is True and x["source_and_license_rights_remain_unverified"] is True and x["trade_executed"] is False'
      - name: Archive P165 real Chromium reviewer evidence (synthetic only)
        uses: actions/upload-artifact@v4
        with:
          name: kuodra-p165-offline-packet-chromium
          path: |
            /tmp/kic-p165-review-packet-browser/p165-valid-packet-browser.png
            /tmp/kic-p165-review-packet-browser/p165-rejected-packet-browser.png
            /tmp/kic-p165-review-packet-browser/p166-valid-source-browser.png
            /tmp/kic-p165-review-packet-browser/p166-rejected-source-browser.png
            /tmp/kic-p165-review-packet-browser/p167-first-offline-packet-browser.png
            /tmp/kic-p165-review-packet-browser/p167-wrong-index-blocked-browser.png
            /tmp/kic-p165-review-packet-browser/p168-rights-gaps-browser.png
            /tmp/kic-p165-review-packet-browser/p169-stock-ndx-csv-replay-browser.png
            /tmp/kic-p165-review-packet-browser/p169-wrong-index-csv-blocked-browser.png
            /tmp/kic-p165-review-packet-browser/p170-printable-a-b-c-report-chromium.png
            /tmp/kic-p165-review-packet-browser/p171-evidence-bundle-browser.png
            /tmp/kic-p165-review-packet-browser/p165-review-packet-browser.json
          if-no-files-found: error
          retention-days: 14
      - name: Archive local source upload browser evidence (synthetic only)
        uses: actions/upload-artifact@v4
        with:
          name: kuodra-local-upload-browser-check
          path: |
            /tmp/kic-local-upload-browser/kuodra-local-upload-guard.png
            /tmp/kic-local-upload-browser/kuodra-p117-four-source-browser.png
            /tmp/kic-local-upload-browser/kuodra-p123-review-browser.png
            /tmp/kic-local-upload-browser/kuodra-local-upload-browser.json
          if-no-files-found: error
          retention-days: 14
      - name: P180 real Chromium Streamlit local-model UI with explicit consent (emulator only)
        run: python -B -m scripts.local_model_triage_browser_smoke /tmp/kic-p180-model-ui
      - name: Archive P180 browser evidence (synthetic only, no original/secret)
        uses: actions/upload-artifact@v4
        with:
          name: kuodra-p180-local-model-triage-chromium
          path: |
            /tmp/kic-p180-model-ui/p180-consented-local-protocol.png
            /tmp/kic-p180-model-ui/p180-local-model-browser.json
          if-no-files-found: error
          retention-days: 14
      - name: Archive actual browser screenshot and machine-readable receipt
        uses: actions/upload-artifact@v4
        with:
          name: proofinvest-guard-browser-evidence
          path: |
            /tmp/kic-guard-browser/guard-browser-clickthrough.png
            /tmp/kic-guard-browser/judge-direct-link-before-run.png
            /tmp/kic-guard-browser/intent-router-browser.png
            /tmp/kic-guard-browser/mock-llm-proposal-accepted.png
            /tmp/kic-guard-browser/mock-llm-proposal-blocked.png
            /tmp/kic-guard-browser/sec-guard-synthetic-hold.png
            /tmp/kic-guard-browser/sec-guard-synthetic-reject.png
            /tmp/kic-guard-browser/sec-guard-synthetic-script.png
            /tmp/kic-guard-browser/sec-guard-browser-downloaded-script.html
            /tmp/kic-guard-browser/sec-guard-compare-browser.png
            /tmp/kic-guard-browser/sec-guard-compare-browser.json
            /tmp/kic-guard-browser/sec-guard-browser-judge-pack.zip
            /tmp/kic-guard-browser/guard-audit-snapshot-inspection.json
            /tmp/kic-guard-browser/guard-browser-evidence.json
          if-no-files-found: error
          retention-days: 14
      - name: Archive bounded local server diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: proofinvest-guard-browser-debug
          path: |
            /tmp/kic-guard-browser/streamlit-server.log
            /tmp/kic-manual-web-guard-browser/web-guard-streamlit.log
            /tmp/kic-guard-browser/mock-proposal-select-diagnostics.json
            /tmp/kic-guard-browser/mock-proposal-menu-after-open.png
            /tmp/kic-guard-browser/mock-proposal-select-trace.zip
            /tmp/kic-p165-review-packet-browser/p165-streamlit-server.log
          if-no-files-found: ignore
          retention-days: 3

  container-offline:
    name: Isolated nonroot read-only Streamlit container (no network)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build and exercise local-only isolated runtime
        run: bash scripts/docker_offline_smoke.sh

  windows-native-ui:
    name: Windows native localhost Streamlit HTTP smoke (no Docker)
    runs-on: windows-latest
    timeout-minutes: 7
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install local UI dependencies (no API credentials)
        run: python -m pip install -r requirements-ui.txt
      - name: P179 Windows loopback local model-compatible protocol, no actual model
        run: python -B -m unittest tests.test_ticker_local_model_triage -v
      - name: P178 actual Windows file-backed originals-to-review CLI (offline)
        run: python -B -m scripts.local_originals_review_smoke
      - name: Confirm native Windows localhost HTTP and shutdown
        run: python -B -m scripts.local_ui_launcher --smoke --port 18682

  genuine-local-model:
    name: P181 actual 135M Ollama CPU inference (public synthetic only)
    # Large downloads are NOT repeated for ordinary commits.
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[model-e2e]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Real 135M model generation and safe KUODRA triage (no user input)
        run: bash scripts/real_local_model_inference_ci.sh

  p233-real-qwen-public-fact:
    name: P233+P234 genuine Qwen public fact and financial anomaly
    # Pull one public model only for an explicitly labeled feature commit.
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[qwen-real-e2e]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: True local Qwen output on two PUBLIC numeric facts (no originals/NDX)
        run: bash scripts/real_qwen_public_facts_ci.sh
